<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlorezokVPN — Персональная подписка</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0f19; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
        .container { width: 100%; max-width: 400px; background: #111827; border-radius: 28px; border: 2px solid rgba(139, 92, 246, 0.3); box-shadow: 0 0 25px rgba(139, 92, 246, 0.2); padding: 24px 20px; display: flex; flex-direction: column; }
        .logo { font-size: 24px; font-weight: 800; text-align: center; background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .card { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 18px; padding: 16px; text-align: center; margin-bottom: 16px; }
        .card h2 { font-size: 15px; margin-bottom: 6px; color: #f3f4f6; }
        .card p { font-size: 12px; color: #9ca3af; margin-bottom: 14px; }
        .link-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .link-input { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 12px; padding: 10px 12px; color: #a78bfa; font-size: 11px; outline: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .copy-btn { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); color: white; border: none; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
        .timer { font-size: 12px; color: #ec4899; font-weight: 700; margin-top: 8px; }
        .instructions { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px; font-size: 12px; color: #d1d5db; line-height: 1.5; }
        .instructions ol { padding-left: 18px; margin-top: 6px; }
        .instructions li { margin-bottom: 4px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; transition: transform 0.3s ease; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">FlorezokVPN</div>

        <div class="card">
            <h2>Персональная подписка</h2>
            <p>Ссылка создана специально для вас:</p>
            
            <div class="link-box">
                <input type="text" id="subLinkInput" class="link-input" readonly>
                <button class="copy-btn" onclick="copySubscription()">Копировать</button>
            </div>
            <div class="timer">⏳ Время жизни: ровно 1 минута</div>
        </div>

        <div class="instructions">
            <strong>📖 Как подключить:</strong>
            <ol>
                <li>Нажмите кнопку <strong>«Копировать»</strong>.</li>
                <li>Откройте приложение <strong>Happ</strong>.</li>
                <li>Вставьте подписку.</li>
            </ol>
        </div>
    </div>

    <div class="toast" id="toast">Ссылка скопирована! 📋</div>

    <script>
        window.onload = function() {
            // Генерируем уникальный ID для каждого нового юзера
            let userId = localStorage.getItem('florezok_uid');
            if (!userId) {
                userId = 'u_' + Math.random().toString(36).substring(2, 9);
                localStorage.setItem('florezok_uid', userId);
            }

            // Формируем уникальную ссылку на sub.html с персональным ID
            const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
            const personalLink = baseUrl + 'sub.html?user=' + userId;
            
            document.getElementById('subLinkInput').value = personalLink;
        };

        function copySubscription() {
            const input = document.getElementById('subLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    </script>
</body>
</html>
